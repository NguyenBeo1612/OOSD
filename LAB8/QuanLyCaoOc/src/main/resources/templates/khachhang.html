<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Khách hàng</h4>
        <a href="/" class="btn btn-secondary btn-sm">Quay lại Menu</a>
    </div>

    <!-- Form thêm khách hàng -->
    <div class="card p-3 mb-4 bg-light" style="max-width: 500px;">
        <form th:action="@{/khach-hang/them}" th:object="${newKhachHang}" method="post">
            <div class="mb-2 row">
                <label class="col-sm-4 col-form-label">Mã KH</label>
                <div class="col-sm-8"><input type="text" th:field="*{maKH}" class="form-control form-control-sm" required></div>
            </div>
            <div class="mb-2 row">
                <label class="col-sm-4 col-form-label">Tên công ty</label>
                <div class="col-sm-8"><input type="text" th:field="*{tenCongTy}" class="form-control form-control-sm" required></div>
            </div>
            <div class="mb-2 row">
                <label class="col-sm-4 col-form-label">Người đại diện</label>
                <div class="col-sm-8"><input type="text" th:field="*{nguoiDaiDien}" class="form-control form-control-sm"></div>
            </div>
            <div class="mb-2 row">
                <label class="col-sm-4 col-form-label">Điện thoại</label>
                <div class="col-sm-8"><input type="text" th:field="*{soDienThoai}" class="form-control form-control-sm"></div>
            </div>
            <button type="submit" class="btn btn-light border btn-sm mt-2">Thêm khách hàng</button>
        </form>
    </div>

    <!-- Bảng hiển thị -->
    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>MaKH</th>
            <th>TenKH</th>
            <th>DienThoai</th>
            <th>NguoiDaiDien</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="kh : ${dsKhachHang}">
            <td th:text="${kh.maKH}">KH001</td>
            <td th:text="${kh.tenCongTy}">Công ty ABC</td>
            <td th:text="${kh.soDienThoai}">0901000001</td>
            <td th:text="${kh.nguoiDaiDien}">Nguyễn Văn A</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
