<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán tiền thuê & dịch vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>4. Thanh toán tiền thuê & dịch vụ</h4>
        <a href="/" class="btn btn-secondary btn-sm">Quay lại Menu</a>
    </div>

    <form method="get" action="/thanh-toan" class="mb-3 row align-items-center">
        <label class="col-auto col-form-label fw-bold">Hợp đồng:</label>
        <div class="col-md-4">
            <select name="soHopDong" class="form-select form-select-sm" onchange="this.form.submit()">
                <option value="">-- Chọn hợp đồng --</option>
                <option th:each="hd : ${dsHopDong}" th:value="${hd.soHopDong}" th:text="${hd.soHopDong + ' - ' + hd.tenCongTy}"
                        th:selected="${hd.soHopDong == selectedHopDong}"></option>
            </select>
        </div>
    </form>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link active" href="#">Tiền thuê (tháng 1-6 trả trước, 7+ đầu tháng)</a>
        </li>
    </ul>

    <table class="table table-bordered table-hover text-center">
        <thead class="table-light">
        <tr>
            <th>Mã HD Thằng</th>
            <th>Tháng/Năm</th>
            <th>Số tiền</th>
            <th>Hạn thanh toán</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="hd : ${dsHoaDon}">
            <td th:text="${hd.soHDThue}">HDT01</td>
            <td th:text="${hd.thang + '/' + hd.nam}">01/2026</td>
            <td th:text="${#numbers.formatDecimal(hd.soTienThue, 0, 'COMMA', 0, 'POINT')}">15,000,000</td>
            <td th:text="${hd.hanThanhToan}">2026-01-05</td>
            <td>
                <span th:class="${hd.trangThaiThanhToan == 'Đã thanh toán' ? 'badge bg-success' : 'badge bg-warning text-dark'}"
                      th:text="${hd.trangThaiThanhToan}"></span>
            </td>
            <td>
                <form th:if="${hd.trangThaiThanhToan != 'Đã thanh toán'}" method="post" action="/thanh-toan/xac-nhan">
                    <input type="hidden" name="soHDThue" th:value="${hd.soHDThue}">
                    <input type="hidden" name="soHopDong" th:value="${selectedHopDong}">
                    <button type="submit" class="btn btn-sm btn-outline-primary">Thu tiền khoản đang chọn</button>
                </form>
            </td>
        </tr>
        <tr th:if="${dsHoaDon == null || dsHoaDon.isEmpty()}">
            <td colspan="6" class="text-muted">Vui lòng chọn hợp đồng để xem hóa đơn</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
