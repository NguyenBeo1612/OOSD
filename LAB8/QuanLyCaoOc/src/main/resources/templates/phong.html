<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Danh sách phòng</h4>
        <a href="/" class="btn btn-secondary btn-sm">Quay lại Menu</a>
    </div>
    <table class="table table-bordered table-striped">
        <thead class="table-light">
        <tr>
            <th>MaPhong</th>
            <th>TenTang</th>
            <th>DienTich</th>
            <th>Huong</th>
            <th>GiaThue</th>
            <th>TrangThai</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${dsPhong}">
            <td th:text="${p.maPhong}">P101</td>
            <td th:text="${p.tenTang}">Tầng 1</td>
            <td th:text="${#numbers.formatDecimal(p.dienTich, 1, 2)}">120.00</td>
            <td th:text="${p.huongPhong}">Đông Nam</td>
            <td th:text="${#numbers.formatDecimal(p.donGiaNiemYet, 0, 'COMMA', 0, 'POINT')}">30000000</td>
            <td th:text="${p.trangThai}">Trống</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
