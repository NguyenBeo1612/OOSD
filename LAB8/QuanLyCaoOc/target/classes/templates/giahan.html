<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lập phiếu gia hạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>5. Lập phiếu gia hạn</h4>
        <a href="/" class="btn btn-secondary btn-sm">Quay lại Menu</a>
    </div>

    <form action="/gia-han/them" method="post" class="p-3 border rounded">
        <div class="mb-3 row">
            <label class="col-sm-4 col-form-label">Hợp đồng</label>
            <div class="col-sm-8">
                <select name="soHopDong" class="form-select form-select-sm" required>
                    <option value="">-- Chọn hợp đồng --</option>
                    <option th:each="hd : ${dsHopDong}" th:value="${hd.soHopDong}" th:text="${hd.soHopDong}"></option>
                </select>
            </div>
        </div>
        <div class="mb-3 row">
            <label class="col-sm-4 col-form-label">Phòng</label>
            <div class="col-sm-8">
                <select name="maPhong" class="form-select form-select-sm" required>
                    <option value="">-- Chọn phòng --</option>
                    <option th:each="p : ${dsPhong}" th:value="${p.maPhong}" th:text="${p.maPhong}"></option>
                </select>
            </div>
        </div>
        <div class="mb-3 row">
            <label class="col-sm-4 col-form-label">Gia hạn (tháng)</label>
            <div class="col-sm-8">
                <input type="number" name="thoiGianGiaHan" class="form-control form-control-sm" value="6" min="1" required>
            </div>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-light border px-4">Lập phiếu gia hạn</button>
        </div>
    </form>
</div>
</body>
</html>
