<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Trang chủ')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="page">
    <h1>Hệ thống quản lý khách sạn</h1>
    <p class="muted">Xin chào <b sec:authentication="name"></b>. Chọn chức năng theo vai trò của bạn.</p>
    <div class="tiles">
        <a class="tile" th:href="@{/danh-muc}"><span>🗂️</span>Danh mục</a>
        <a class="tile" sec:authorize="hasAnyRole('PHUC_VU','QUAN_LY')" th:href="@{/phong}"><span>🛏️</span>Phòng – tiện nghi</a>
        <a class="tile" sec:authorize="hasAnyRole('LE_TAN','QUAN_LY')" th:href="@{/dat-phong}"><span>📅</span>Đặt / nhận phòng</a>
        <a class="tile" th:href="@{/dich-vu}"><span>🍽️</span>Ghi nhận dịch vụ</a>
        <a class="tile" sec:authorize="hasAnyRole('PHUC_VU','THANH_TOAN','QUAN_LY')" th:href="@{/tra-phong}"><span>🧾</span>Trả phòng – thanh toán</a>
        <a class="tile" sec:authorize="hasRole('QUAN_LY')" th:href="@{/thong-ke}"><span>📊</span>Thống kê</a>
    </div>
</main>
</body>
</html>
