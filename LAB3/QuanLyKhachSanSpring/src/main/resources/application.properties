# ===== Ứng dụng =====
spring.application.name=QuanLyKhachSan
server.port=8080

# ===== SQL Server (sửa lại cho đúng máy của bạn) =====
# Chạy database/QuanLyKhachSan.sql trước để tạo CSDL QuanLyKhachSan và dữ liệu mẫu.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyKhachSan;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.mode=never

spring.mvc.format.date=yyyy-MM-dd
spring.thymeleaf.cache=false
