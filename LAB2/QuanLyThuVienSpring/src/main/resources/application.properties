# ===== Ứng dụng =====
spring.application.name=QuanLyThuVien
server.port=8080

# ===== SQL Server (sửa lại cho đúng máy của bạn) =====
# Chạy database/QuanLyThuVien.sql trước để tạo CSDL QuanLyThuVienDB và dữ liệu mẫu.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyThuVienDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Schema do script SQL quản lý, Hibernate không tự tạo/sửa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.sql.init.mode=never

# input type="date" gửi lên dạng yyyy-MM-dd
spring.mvc.format.date=yyyy-MM-dd
spring.thymeleaf.cache=false
