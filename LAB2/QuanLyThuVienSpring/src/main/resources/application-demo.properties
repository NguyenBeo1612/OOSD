# Profile demo: chạy không cần SQL Server (H2 trong bộ nhớ, chế độ tương thích MSSQLServer).
# Dùng: mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:qltv;MODE=MSSQLServer;DATABASE_TO_UPPER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql
spring.sql.init.encoding=UTF-8
