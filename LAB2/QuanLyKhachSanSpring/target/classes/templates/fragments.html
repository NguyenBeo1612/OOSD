<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' – Quản lý khách sạn'">Quản lý khách sạn</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/}">🏨 Quản lý khách sạn</a>
    <nav>
        <a th:href="@{/danh-muc}">Danh mục</a>
        <a sec:authorize="hasAnyRole('PHUC_VU','QUAN_LY')" th:href="@{/phong}">Phòng – tiện nghi</a>
        <a sec:authorize="hasAnyRole('LE_TAN','QUAN_LY')" th:href="@{/dat-phong}">Đặt / nhận phòng</a>
        <a th:href="@{/dich-vu}">Dịch vụ</a>
        <a sec:authorize="hasAnyRole('PHUC_VU','THANH_TOAN','QUAN_LY')" th:href="@{/tra-phong}">Trả phòng</a>
        <a sec:authorize="hasRole('QUAN_LY')" th:href="@{/thong-ke}">Thống kê</a>
    </nav>
    <form th:action="@{/logout}" method="post" class="user">
        <span sec:authentication="name">user</span>
        <button type="submit" class="btn ghost small">Đăng xuất</button>
    </form>
</header>
<div th:fragment="flash">
    <div class="alert ok" th:if="${ok}" th:text="${ok}"></div>
    <div class="alert err" th:if="${loi}" th:text="${loi}"></div>
</div>
</body>
</html>
