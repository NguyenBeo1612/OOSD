<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thống kê')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="page">
    <h1>Tra cứu / thống kê</h1>
    <div th:replace="~{fragments :: flash}"></div>
    <form class="card row end" th:action="@{/thong-ke}" method="get">
        <label>Từ ngày <input type="date" name="tu" th:value="${tu}"></label>
        <label>Đến ngày <input type="date" name="den" th:value="${den}"></label>
        <button class="btn">Thống kê</button>
    </form>
    <div class="kpis" th:if="${th != null}">
        <div class="kpi"><span>Phiếu đặt trong kỳ</span><b th:text="${th['SoPhieuDat']}"></b></div>
        <div class="kpi"><span>Phiếu đang ở</span><b th:text="${th['DangO']}"></b></div>
        <div class="kpi"><span>Số hóa đơn</span><b th:text="${th['SoHoaDon']}"></b></div>
        <div class="kpi"><span>Doanh thu hóa đơn</span><b th:text="${#numbers.formatDecimal(th['DoanhThuHoaDon'],1,'COMMA',0,'POINT')}"></b></div>
        <div class="kpi"><span>Tổng đền bù</span><b th:text="${#numbers.formatDecimal(th['TongDenBu'],1,'COMMA',0,'POINT')}"></b></div>
    </div>
    <section class="card" th:if="${dv != null}">
        <h2>Thống kê dịch vụ sử dụng</h2>
        <p class="muted" th:if="${#lists.isEmpty(dv)}">Không có dịch vụ trong khoảng thời gian này.</p>
        <table th:if="${!#lists.isEmpty(dv)}"><thead><tr><th>Mã DV</th><th>Dịch vụ</th><th>Tổng số lượng</th><th>Tổng tiền</th></tr></thead><tbody>
        <tr th:each="r : ${dv}"><td th:text="${r['MaDV']}"></td><td th:text="${r['TenDV']}"></td><td th:text="${r['TongSoLuong']}"></td>
            <td th:text="${#numbers.formatDecimal(r['TongTien'],1,'COMMA',0,'POINT')}"></td></tr></tbody></table>
    </section>
</main>
</body>
</html>
