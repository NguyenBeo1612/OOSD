<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Danh mục')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="page">
    <h1>Danh mục dữ liệu nền</h1>
    <div th:replace="~{fragments :: flash}"></div>
    <div class="grid-auto">
        <section class="card" id="khu-vuc">
            <h2>Khu vực</h2>
            <form class="row end" th:action="@{/danh-muc/khu-vuc}" method="post">
                <label>Mã <input name="ma" required maxlength="20"></label>
                <label>Tên khu vực <input name="ten" required></label>
                <button class="btn">Thêm</button>
            </form>
            <table><thead><tr><th>Mã</th><th>Tên</th><th></th></tr></thead><tbody>
            <tr th:each="r : ${khuVuc}"><td th:text="${r['MaKhuVuc']}"></td><td th:text="${r['TenKhuVuc']}"></td>
                <td><form th:action="@{/danh-muc/xoa}" method="post" onsubmit="return confirm('Xóa?')"><input type="hidden" name="loai" value="khu-vuc">
                    <input type="hidden" name="ma" th:value="${r['MaKhuVuc']}"><button class="btn danger small">Xóa</button></form></td></tr>
            </tbody></table>
        </section>
        <section class="card" id="nhan-vien">
            <h2>Nhân viên</h2>
            <form class="row end" th:action="@{/danh-muc/nhan-vien}" method="post">
                <label>Mã <input name="ma" required maxlength="20"></label>
                <label>Họ tên <input name="ten" required></label>
                <label>Vai trò <select name="vaiTro"><option th:each="v : ${vaiTros}" th:text="${v}" th:value="${v}"></option></select></label>
                <label>SĐT <input name="sdt"></label>
                <button class="btn">Thêm</button>
            </form>
            <table><thead><tr><th>Mã</th><th>Họ tên</th><th>Vai trò</th><th>SĐT</th><th></th></tr></thead><tbody>
            <tr th:each="r : ${nhanVien}"><td th:text="${r['MaNV']}"></td><td th:text="${r['HoTen']}"></td><td th:text="${r['VaiTro']}"></td>
                <td th:text="${r['SoDienThoai']}"></td>
                <td><form th:action="@{/danh-muc/xoa}" method="post" onsubmit="return confirm('Xóa?')"><input type="hidden" name="loai" value="nhan-vien">
                    <input type="hidden" name="ma" th:value="${r['MaNV']}"><button class="btn danger small">Xóa</button></form></td></tr>
            </tbody></table>
        </section>
        <section class="card" id="loai-tn">
            <h2>Loại tiện nghi</h2>
            <form class="row end" th:action="@{/danh-muc/loai-tn}" method="post">
                <label>Mã <input name="ma" required maxlength="20"></label>
                <label>Tên loại <input name="ten" required></label>
                <button class="btn">Thêm</button>
            </form>
            <table><thead><tr><th>Mã</th><th>Tên loại</th><th></th></tr></thead><tbody>
            <tr th:each="r : ${loaiTN}"><td th:text="${r['MaLoaiTN']}"></td><td th:text="${r['TenLoaiTN']}"></td>
                <td><form th:action="@{/danh-muc/xoa}" method="post" onsubmit="return confirm('Xóa?')"><input type="hidden" name="loai" value="loai-tn">
                    <input type="hidden" name="ma" th:value="${r['MaLoaiTN']}"><button class="btn danger small">Xóa</button></form></td></tr>
            </tbody></table>
        </section>
        <section class="card" id="dich-vu">
            <h2>Dịch vụ</h2>
            <form class="row end" th:action="@{/danh-muc/dich-vu}" method="post">
                <label>Mã <input name="ma" required maxlength="20"></label>
                <label>Tên DV <input name="ten" required></label>
                <label>Đơn vị tính <input name="dvt" required></label>
                <label>Đơn giá <input type="number" name="gia" min="0" step="1000" required></label>
                <button class="btn">Thêm</button>
            </form>
            <table><thead><tr><th>Mã</th><th>Tên</th><th>ĐVT</th><th>Đơn giá</th><th></th></tr></thead><tbody>
            <tr th:each="r : ${dichVu}"><td th:text="${r['MaDV']}"></td><td th:text="${r['TenDV']}"></td><td th:text="${r['DonViTinh']}"></td>
                <td th:text="${#numbers.formatDecimal(r['DonGia'],1,'COMMA',0,'POINT')}"></td>
                <td><form th:action="@{/danh-muc/xoa}" method="post" onsubmit="return confirm('Xóa?')"><input type="hidden" name="loai" value="dich-vu">
                    <input type="hidden" name="ma" th:value="${r['MaDV']}"><button class="btn danger small">Xóa</button></form></td></tr>
            </tbody></table>
        </section>
        <section class="card" id="quy-dinh">
            <h2>Quy định đền bù (BR08)</h2>
            <form class="row end" th:action="@{/danh-muc/quy-dinh}" method="post">
                <label>Mã <input name="ma" required maxlength="30"></label>
                <label>Loại tiện nghi <select name="loai"><option th:each="r : ${loaiTN}" th:value="${r['MaLoaiTN']}" th:text="${r['TenLoaiTN']}"></option></select></label>
                <label>Mức độ thiệt hại <input name="mucDo" required></label>
                <label>Mức đền bù <input type="number" name="tien" min="0" step="1000" required></label>
                <button class="btn">Thêm</button>
            </form>
            <table><thead><tr><th>Mã</th><th>Loại TN</th><th>Mức độ</th><th>Mức đền bù</th><th></th></tr></thead><tbody>
            <tr th:each="r : ${quyDinh}"><td th:text="${r['MaQuyDinh']}"></td><td th:text="${r['TenLoaiTN']}"></td><td th:text="${r['MucDoThietHai']}"></td>
                <td th:text="${#numbers.formatDecimal(r['MucDenBu'],1,'COMMA',0,'POINT')}"></td>
                <td><form th:action="@{/danh-muc/xoa}" method="post" onsubmit="return confirm('Xóa?')"><input type="hidden" name="loai" value="quy-dinh">
                    <input type="hidden" name="ma" th:value="${r['MaQuyDinh']}"><button class="btn danger small">Xóa</button></form></td></tr>
            </tbody></table>
        </section>
    </div>
</main>
</body>
</html>
