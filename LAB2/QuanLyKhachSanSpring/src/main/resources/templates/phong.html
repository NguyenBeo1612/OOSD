<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Phòng – tiện nghi')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="page">
    <h1>Phòng, tiện nghi và lắp đặt</h1>
    <div th:replace="~{fragments :: flash}"></div>
    <section class="card">
        <h2>Phòng (BR01, BR02)</h2>
        <form class="row end" th:action="@{/phong/them}" method="post">
            <label>Số phòng <input name="so" required maxlength="20"></label>
            <label>Khu vực <select name="khu"><option th:each="k : ${khuVuc}" th:value="${k['MaKhuVuc']}" th:text="${k['TenKhuVuc']}"></option></select></label>
            <label>Số người tối đa <input type="number" name="max" min="1" required></label>
            <label>Đơn giá / ngày <input type="number" name="gia" min="0" step="10000" required></label>
            <button class="btn">Thêm phòng</button>
        </form>
        <table><thead><tr><th>Số phòng</th><th>Khu vực</th><th>Sức chứa</th><th>Đơn giá / ngày</th><th>Trạng thái</th><th></th></tr></thead><tbody>
        <tr th:each="r : ${phong}">
            <td th:text="${r['SoPhong']}"></td><td th:text="${r['TenKhuVuc']}"></td><td th:text="${r['SoNguoiToiDa']}"></td>
            <td th:text="${#numbers.formatDecimal(r['DonGiaNgay'],1,'COMMA',0,'POINT')}"></td>
            <td><span class="badge" th:classappend="${r['TrangThai'] == 'Trống'} ? 'green' : (${r['TrangThai'] == 'Bảo trì'} ? '' : 'red')" th:text="${r['TrangThai']}"></span></td>
            <td><form th:if="${r['TrangThai'] == 'Trống' or r['TrangThai'] == 'Bảo trì'}" th:action="@{/phong/bao-tri}" method="post">
                <input type="hidden" name="so" th:value="${r['SoPhong']}">
                <button class="btn ghost small" th:text="${r['TrangThai'] == 'Trống'} ? 'Chuyển bảo trì' : 'Hoàn tất bảo trì'"></button></form></td>
        </tr></tbody></table>
    </section>
    <div class="grid2b">
        <section class="card" id="tien-nghi">
            <h2>Tiện nghi (BR03)</h2>
            <form class="row end" th:action="@{/phong/tien-nghi}" method="post">
                <label>Mã TN <input name="ma" required maxlength="30"></label>
                <label>Loại <select name="loai"><option th:each="l : ${loaiTN}" th:value="${l['MaLoaiTN']}" th:text="${l['TenLoaiTN']}"></option></select></label>
                <label>Số thứ tự <input type="number" name="stt" min="1" required></label>
                <label>Tình trạng <input name="tinhTrang" value="Tốt"></label>
                <button class="btn">Thêm</button>
            </form>
            <table><thead><tr><th>Mã</th><th>Loại</th><th>STT</th><th>Tình trạng</th></tr></thead><tbody>
            <tr th:each="r : ${tienNghi}"><td th:text="${r['MaTienNghi']}"></td><td th:text="${r['TenLoaiTN']}"></td>
                <td th:text="${r['SoThuTu']}"></td><td th:text="${r['TinhTrangHienTai']}"></td></tr></tbody></table>
        </section>
        <section class="card" id="lap-dat">
            <h2>Phiếu lắp đặt / luân chuyển (BR04)</h2>
            <form class="row end" th:action="@{/phong/lap-dat}" method="post">
                <label>Thiết bị <select name="maTN"><option th:each="t : ${tienNghi}" th:value="${t['MaTienNghi']}" th:text="${t['MaTienNghi'] + ' – ' + t['TenLoaiTN']}"></option></select></label>
                <label>Phòng <select name="soPhong"><option th:each="p : ${phong}" th:value="${p['SoPhong']}" th:text="${p['SoPhong']}"></option></select></label>
                <label>Ngày <input type="date" name="ngay" th:value="${homNay}"></label>
                <label>Tình trạng <input name="tinhTrang" value="Tốt" required></label>
                <label>Ghi chú <input name="ghiChu"></label>
                <button class="btn">Lập phiếu</button>
            </form>
            <table><thead><tr><th>Số phiếu</th><th>Thiết bị</th><th>Phòng</th><th>Ngày</th><th>Tình trạng</th><th>NV</th></tr></thead><tbody>
            <tr th:each="r : ${lapDat}"><td th:text="${r['SoPhieuLapDat']}"></td><td th:text="${r['MaTienNghi'] + ' (' + r['TenLoaiTN'] + ')'}"></td>
                <td th:text="${r['SoPhong']}"></td><td th:text="${#dates.format(r['NgayLap'],'dd/MM/yyyy')}"></td>
                <td th:text="${r['TinhTrang']}"></td><td th:text="${r['HoTen']}"></td></tr></tbody></table>
        </section>
    </div>
</main>
</body>
</html>
