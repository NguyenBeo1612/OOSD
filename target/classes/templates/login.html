<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng nhập - Quản Lý Thư Viện</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #e9ecef;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .login-card {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 320px;
      }
      .login-card h2 {
        text-align: center;
        color: #1a365d;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .form-group input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .btn-login {
        width: 100%;
        padding: 10px;
        background-color: #1a365d;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      .btn-login:hover {
        background-color: #2b4c7e;
      }
      .error-msg {
        color: red;
        text-align: center;
        margin-bottom: 15px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>ĐĂNG NHẬP</h2>
      <div th:if="${error}" class="error-msg" th:text="${error}"></div>
      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label>Tài khoản:</label>
          <input
            type="text"
            name="username"
            required
            placeholder="Nhập tài khoản"
          />
        </div>
        <div class="form-group">
          <label>Mật khẩu:</label>
          <input
            type="password"
            name="password"
            required
            placeholder="Nhập mật khẩu"
          />
        </div>
        <button type="submit" class="btn-login">Đăng Nhập</button>
      </form>
    </div>
  </body>
</html>
