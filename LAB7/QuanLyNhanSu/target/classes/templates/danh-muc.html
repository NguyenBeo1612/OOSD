<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh mục - FrmDanhMuc</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #e6e6e6; font-family: 'Segoe UI', sans-serif; }
        .window-frame {
            background-color: #f0f0f0;
            border: 2px solid #a0a0a0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            max-width: 950px;
            margin: 20px auto;
            padding: 15px;
        }
        .nav-tabs .nav-link {
            background-color: #e1e1e1;
            border: 1px solid #a0a0a0;
            color: #000;
            margin-right: 2px;
            border-radius: 0;
            padding: 4px 12px;
            font-size: 13px;
        }
        .nav-tabs .nav-link.active {
            background-color: #f0f0f0;
            border-bottom-color: #f0f0f0;
            font-weight: bold;
        }
        .tab-content-box {
            border: 1px solid #a0a0a0;
            background-color: #fff;
            padding: 10px;
            min-height: 320px;
        }
        .win-table { font-size: 13px; margin-bottom: 0; }
        .win-table th { background-color: #f5f5f5; border-bottom: 1px solid #ccc; font-weight: normal; }
        .win-table td, .win-table th { border-right: 1px solid #e0e0e0; padding: 4px 8px; }
        .form-area {
            background-color: #f0f0f0;
            border-top: 1px solid #ccc;
            padding-top: 15px;
            margin-top: 10px;
            font-size: 13px;
        }
        .btn-win {
            background-color: #e1e1e1;
            border: 1px solid #707070;
            padding: 3px 25px;
            font-size: 13px;
            color: #000;
        }
        .btn-win:hover { background-color: #d0d0d0; }
    </style>
</head>
<body>

<div class="window-frame">
    <small class="text-muted d-block mb-1">Danh mục</small>
    
    <!-- Tab header -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#phongban">Phòng ban</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#chucvu">Chức vụ</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#ca">Ca làm việc</button>
        </li>
    </ul>

    <!-- Tab content -->
    <div class="tab-content tab-content-box" id="myTabContent">
        <!-- Tab Phòng ban -->
        <div class="tab-pane fade show active" id="phongban">
            <table class="table table-hover win-table">
                <thead>
                    <tr>
                        <th style="width: 30px;"></th>
                        <th>MaPB</th>
                        <th>TenPhongBan</th>
                        <th>MoTa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pb : ${dsPhongBan}">
                        <td class="text-center">▶</td>
                        <td th:text="${'PB0' + pb.maPhongBan}">PB01</td>
                        <td th:text="${pb.tenPhongBan}">Phòng Kỹ thuật</td>
                        <td th:text="${pb.moTa}">Mô tả...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Form Nhập dữ liệu bên dưới -->
    <div class="form-area">
        <form th:action="@{/danh-muc/luu-phong-ban}" method="post">
            <div class="row align-items-center g-2">
                <div class="col-auto"><label>Mã PB:</label></div>
                <div class="col-md-2"><input type="text" class="form-control form-control-sm" placeholder="Tự động" disabled></div>
                
                <div class="col-auto"><label>Tên PB:</label></div>
                <div class="col-md-3"><input type="text" name="tenPhongBan" class="form-control form-control-sm" required></div>
                
                <div class="col-auto"><label>Ghi chú:</label></div>
                <div class="col-md-3"><input type="text" name="moTa" class="form-control form-control-sm"></div>
                
                <div class="col-auto ms-auto">
                    <button type="submit" class="btn btn-win">Thêm</button>
                </div>
            </div>
        </form>
    </div>

    <div class="text-end mt-3">
        <a href="/" class="btn btn-win">Đóng</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
