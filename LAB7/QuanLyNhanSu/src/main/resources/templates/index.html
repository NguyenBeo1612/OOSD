<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý công ty Sơn Đông Á - FrmMain</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #e6e6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .window-frame {
            background-color: #f0f0f0;
            border: 2px solid #a0a0a0;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            max-width: 900px;
            margin: 30px auto;
            padding: 40px;
        }
        .window-title {
            color: #0d3c61;
            font-weight: bold;
            font-size: 26px;
            text-align: center;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }
        .btn-winforms {
            background-color: #e1e1e1;
            border: 1px solid #707070;
            color: #000;
            font-weight: 500;
            font-size: 15px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.1s ease;
        }
        .btn-winforms:hover {
            background-color: #cecece;
            border-color: #444;
            color: #000;
        }
        .btn-winforms:active {
            background-color: #b5b5b5;
        }
        .btn-exit {
            width: 250px;
            margin: 30px auto 0 auto;
        }
    </style>
</head>
<body>

<div class="window-frame">
    <div class="window-title">Quản Lý Nhân Sự Của Sơn Đông Á</div>

    <div class="row g-4 justify-content-center">
        <div class="col-6">
            <a href="/danh-muc" class="btn-winforms">Danh mục phòng ban</a>
        </div>
        <div class="col-6">
            <a href="/tuyen-dung" class="btn-winforms">Tuyển dụng - Thử việc</a>
        </div>

        <div class="col-6">
            <a href="/khen-thuong" class="btn-winforms">Khen thưởng - Kỷ luật</a>
        </div>
        <div class="col-6">
            <a href="#" class="btn-winforms">Lịch phân công ca</a>
        </div>

        <div class="col-6">
            <a href="#" class="btn-winforms">Chấm công & Phụ trội</a>
        </div>
        <div class="col-6">
            <a href="#" class="btn-winforms">Hợp đồng & Bảo hiểm</a>
        </div>

        <div class="col-6">
            <a href="#" class="btn-winforms">Lương - Thống kê</a>
        </div>
        <div class="col-6">
            <a href="#" class="btn-winforms">Đánh giá nhân sự</a>
        </div>
    </div>

    <div class="text-center">
        <a href="#" onclick="alert('Đã thoát hệ thống!');" class="btn-winforms btn-exit">Thoát</a>
    </div>
</div>

</body>
</html>
